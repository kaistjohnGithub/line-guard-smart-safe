version: "3.9"

services:

  # ── Frontend (nginx static) ─────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ── Backend (FastAPI) ───────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ssg:ssg123@db:5432/ssg_db
      - MEDIA_ROOT=/app/media
      - CORS_ORIGINS=*
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ssg_db
      POSTGRES_USER: ssg
      POSTGRES_PASSWORD: ssg123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssg -d ssg_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── pgAdmin (optional DB GUI) ───────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ssg.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped
    profiles:
      - tools          # start only with: docker compose --profile tools up

volumes:
  postgres_data:       # PostgreSQL data
  media_data:          # Images & videos uploaded via API
