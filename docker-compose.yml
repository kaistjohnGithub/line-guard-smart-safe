services:

  # ── Frontend (nginx static) ─────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    volumes:
      - ./src:/usr/share/nginx/html/src
      - ./index.html:/usr/share/nginx/html/index.html
      - ./media:/usr/share/nginx/html/media
    depends_on:
      - backend
    restart: unless-stopped

  # ── Backend (FastAPI) ───────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ssg_db}
      POSTGRES_USER: ${POSTGRES_USER:-ssg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ssg123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ssg} -d ${POSTGRES_DB:-ssg_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Qwen Worker (GPU video analysis) ───────────────────
  qwen-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://ssg:ssg123@db:5432/ssg_db
      - MEDIA_ROOT=/app/media
      - QWEN_MODEL=${QWEN_MODEL:-Qwen/Qwen2.5-VL-3B-Instruct}
      - HF_HUB_CACHE=/app/model/hub
    volumes:
      - ./media:/app/media
      - model_data:/app/model
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu                # start only with: docker compose --profile gpu up

  # ── pgAdmin (optional DB GUI) ───────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@lineguard.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - db
    restart: unless-stopped
    profiles:
      - tools          # start only with: docker compose --profile tools up

volumes:
  postgres_data:       # PostgreSQL data
  model_data:          # Qwen model weights cache
