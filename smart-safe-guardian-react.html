  --bg:#f0f4fb;--surface:#fff;--surface2:#f4f7ff;--surface3:#e8effe;
  --blue:#1d6ef5;--blue-light:rgba(29,110,245,0.09);--blue-mid:rgba(29,110,245,0.18);

  --gray:#64748b;
  --t1:#0f172a;--t2:#475569;--t3:#94a3b8;
  --border:#e2e8f4;--border2:#c7d6ef;
  --r:8px;--shadow:0 1px 4px rgba(29,110,245,0.07);
}
html,body,#root{height:100%;overflow:hidden}
body{font-family:'IBM Plex Sans','Noto Sans Thai',sans-serif;background:var(--bg);color:var(--t1);font-size:13px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--surface2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#a3b8e0}
input,select,textarea,button{font-family:inherit}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes scanline{0%{top:0}100%{top:100%}}
@keyframes slideup{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.pulse{animation:pulse 2s infinite}
.blink{animation:blink 1s infinite}
.scan{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(29,110,245,.5),transparent);animation:scanline 2.5s linear infinite;pointer-events:none}

function Btn({children, variant='ghost', size='md', onClick, disabled, style={}}){
  const base = {
    border:'1.5px solid',borderRadius:6,cursor:disabled?'not-allowed':'pointer',
    fontFamily:'inherit',fontWeight:600,transition:'all .15s',whiteSpace:'nowrap',
    opacity:disabled?0.5:1,
    fontSize: size==='sm'?11:size==='lg'?14:12,
    padding: size==='sm'?'4px 10px':size==='lg'?'8px 18px':'5px 13px',
  };
  const variants = {
    primary:{background:'var(--blue)',borderColor:'var(--blue)',color:'#fff'},
    ghost:{background:'var(--surface2)',borderColor:'var(--border2)',color:'var(--t2)'},
    teal:{background:'var(--blue-light)',borderColor:'rgba(29,110,245,.3)',color:'var(--blue)'},
    danger:{background:'var(--red-light)',borderColor:'rgba(229,62,62,.35)',color:'var(--red)'},
    amber:{background:'var(--amber-light)',borderColor:'rgba(217,119,6,.35)',color:'var(--amber)'},
  };
  return (
    <button onClick={disabled?undefined:onClick} style={{...base,...variants[variant],...style}}>
      {children}
    </button>
  );
}

function Badge({children, color='blue', style={}}){
  const colors = {
    blue:{bg:'var(--blue-light)',border:'rgba(29,110,245,.25)',text:'var(--blue)'},
    red:{bg:'var(--red-light)',border:'rgba(229,62,62,.3)',text:'var(--red)'},
    amber:{bg:'var(--amber-light)',border:'rgba(217,119,6,.3)',text:'var(--amber)'},
    green:{bg:'var(--green-light)',border:'rgba(22,163,74,.3)',text:'var(--green)'},
    gray:{bg:'rgba(100,116,139,.12)',border:'rgba(100,116,139,.25)',text:'var(--gray)'},
  };
  const c = colors[color]||colors.blue;
  return (
    <span style={{fontSize:10,padding:'2px 8px',borderRadius:4,fontWeight:700,
      background:c.bg,border:`1px solid ${c.border}`,color:c.text,
      textTransform:'uppercase',letterSpacing:'0.05em',...style}}>
      {children}
    </span>
  );
}

    offline:{bg:'rgba(100,116,139,.12)',border:'rgba(100,116,139,.25)',color:'var(--gray)',label:'OFFLINE'},
    delay:{bg:'var(--amber-light)',border:'rgba(217,119,6,.3)',color:'var(--amber)',label:'DELAY'},
    critical:{bg:'var(--red-light)',border:'rgba(229,62,62,.3)',color:'var(--red)',label:'CRITICAL'},
  };
  const c = map[status]||map.offline;
  return <span style={{fontSize:9,fontWeight:700,padding:'2px 7px',borderRadius:3,
    background:c.bg,border:`1px solid ${c.border}`,color:c.color,
    textTransform:'uppercase',letterSpacing:'0.07em'}}>{c.label}</span>;
}

function KPICard({value, label, delta, color='blue'}){
  const c = {blue:'var(--blue)',green:'var(--green)',red:'var(--red)',
    amber:'var(--amber)',gray:'var(--gray)'};
  const bc = {blue:'var(--blue)',green:'var(--green)',red:'var(--red)',
    amber:'var(--amber)',gray:'var(--border)'};
  return <div style={{background:'var(--surface)',border:'1px solid var(--border)',
    borderRadius:10,padding:'12px 14px',position:'relative',overflow:'hidden'}}>
    <div style={{position:'absolute',top:0,left:0,right:0,height:3,
      background:bc[color],animation:color==='red'?'blink 2s infinite':'none'}}/>
    <div style={{fontSize:26,fontWeight:700,color:c[color],lineHeight:1}}>{value}</div>
    <div style={{fontSize:10,color:'var(--t3)',textTransform:'uppercase',
      letterSpacing:'0.07em',marginTop:4,fontWeight:500}}>{label}</div>
    {delta && <div style={{fontSize:10,marginTop:3,color:'var(--t3)'}}>{delta}</div>}
  </div>;
}

function Divider(){

// Toast System
function ToastContainer({toasts}){
  return <div style={{position:'fixed',bottom:20,right:20,zIndex:9999,
    display:'flex',flexDirection:'column',gap:8,pointerEvents:'none'}}>
    {toasts.map(t=>(
      <div key={t.id} style={{background:'#fff',border:'1px solid var(--border2)',
        borderRadius:10,padding:'10px 16px',display:'flex',alignItems:'center',gap:10,
        minWidth:260,fontSize:12,pointerEvents:'all',
        borderLeft:`3px solid ${t.color||'var(--blue)'}`,
        animation:'slideup .3s ease',boxShadow:'0 4px 16px rgba(0,0,0,.08)'}}>
        <span style={{fontSize:16}}>{t.icon}</span>{t.msg}
      </div>
    ))}
  </div>;
}

function useToast(){
  const [toasts,setToasts] = useState([]);
  const add = useCallback((msg,icon='✓',color='var(--blue)')=>{
    const id = Date.now();
    setToasts(p=>[...p,{id,msg,icon,color}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),2800);
  },[]);
  return {toasts,add};
}

// Modal
function Modal({show,onClose,title,children,footer}){
  if(!show) return null;
  return <div onClick={e=>{if(e.target===e.currentTarget)onClose()}}
    style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',zIndex:1000,
      display:'flex',alignItems:'center',justifyContent:'center'}}>
    <div style={{background:'#fff',borderRadius:14,width:600,maxWidth:'95vw',
      maxHeight:'85vh',display:'flex',flexDirection:'column',overflow:'hidden',
      boxShadow:'0 24px 48px rgba(0,0,0,.12)'}}>
      <div style={{padding:'16px 20px',borderBottom:'1px solid var(--border)',
        display:'flex',alignItems:'center',justifyContent:'space-between',background:'#f8faff',flexShrink:0}}>
        <span style={{fontSize:16,fontWeight:700}}>{title}</span>
        <button onClick={onClose} style={{width:30,height:30,borderRadius:'50%',
          border:'1px solid var(--border2)',background:'var(--surface2)',cursor:'pointer',
          display:'flex',alignItems:'center',justifyContent:'center',fontSize:14}}>✕</button>
      </div>
      <div style={{padding:20,overflowY:'auto',flex:1}}>{children}</div>
      {footer && <div style={{padding:'12px 20px',borderTop:'1px solid var(--border)',
        display:'flex',gap:8,justifyContent:'flex-end',background:'#f8faff',flexShrink:0}}>{footer}</div>}
    </div>
  </div>;
}

function FormInput({value,onChange,placeholder,style={}}){
  return <input value={value} onChange={e=>onChange&&onChange(e.target.value)}

    style={{background:'var(--surface2)',border:'1px solid var(--border2)',

function CameraCard({cam,onOpen}){
  const topColors = {online:'var(--green)',offline:'var(--gray)',
    delay:'var(--amber)',critical:'var(--red)'};
  const topColor = topColors[cam.status];
  const riskColors = {CRITICAL:'var(--red)',HIGH:'var(--red)',
    MED:'var(--amber)',LOW:'var(--green)','N/A':'var(--gray)'};
  const isOff = cam.status==='offline';
  return (
    <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:10,padding:12,
      cursor:isOff?'default':'pointer',transition:'all .18s',position:'relative',overflow:'hidden'}}
      onMouseEnter={e=>{if(!isOff)e.currentTarget.style.borderColor='var(--blue)'}}
      onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--border)'}}>
      <div style={{position:'absolute',top:0,left:0,right:0,height:3,
        background:topColor,animation:cam.status==='critical'?'blink 1s infinite':'none'}}/>
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:6}}>
        <span style={{fontSize:10,color:'var(--blue)',fontWeight:700,letterSpacing:'0.1em'}}>{cam.id}</span>
        <StatusPill status={cam.status}/>
      </div>
      {/* Mini preview */}
      <div style={{height:72,background:'#0a1020',borderRadius:6,marginBottom:8,
        position:'relative',overflow:'hidden',display:'flex',alignItems:'center',justifyContent:'center'}}>
        {!isOff && <div className="scan" style={{top:0}}/>}
        <span style={{fontSize:10,color:'rgba(29,110,245,.5)',letterSpacing:'0.1em'}}>
          {isOff?'— OFFLINE —':'▶ LIVE FEED'}
        </span>
      </div>
      <div style={{fontSize:13,fontWeight:600,marginBottom:2}}>{cam.name}</div>
      <div style={{fontSize:10,color:'var(--t3)',marginBottom:10}}>{cam.process} · {cam.station}</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:5,marginBottom:10}}>
        {[
          {v:cam.fps||'—',l:'FPS',c:cam.fps<5&&cam.fps>0?'var(--amber)':'var(--t1)'},
          {v:cam.alerts,l:'Alerts',c:cam.alerts>0?'var(--red)':'var(--t1)'},
          {v:cam.risk,l:'Risk',c:riskColors[cam.risk]||'var(--gray)'},
        ].map(s=>(
          <div key={s.l} style={{background:'var(--surface2)',border:'1px solid var(--border)',
            borderRadius:5,padding:'5px 7px'}}>
            <div style={{fontSize:13,fontWeight:700,color:s.c,lineHeight:1}}>{s.v}</div>
            <div style={{fontSize:8,color:'var(--t3)',textTransform:'uppercase',
              letterSpacing:'0.06em',marginTop:2}}>{s.l}</div>
          </div>
        ))}
      </div>
      <button onClick={isOff?undefined:onOpen} disabled={isOff}
        style={{width:'100%',padding:'7px',background:isOff?'var(--surface2)':'rgba(29,110,245,.09)',
          border:`1px dashed ${isOff?'var(--border)':'rgba(29,110,245,.3)'}`,
          borderRadius:5,color:isOff?'var(--gray)':'var(--blue)',fontSize:11,
          fontWeight:700,cursor:isOff?'not-allowed':'pointer',fontFamily:'inherit',
          letterSpacing:'0.06em',textTransform:'uppercase',opacity:isOff?0.5:1}}>
        {isOff?'● Offline':'▶ Open Monitor'}
      </button>
    </div>
  );
}

// ─── PAGE: SAFETY RULES ──────────────────────────────────
function SafetyRules({toast}){

  const [showModal,setShowModal] = useState(false);
  const tabs = [
    {key:'action',label:'Unsafe Actions',n:RULES.action.length},
    {key:'condition',label:'Unsafe Conditions',n:RULES.condition.length},
    {key:'nearmiss',label:'Near-Miss',n:RULES.nearmiss.length},
    {key:'pending',label:'Pending',n:RULES.pending.length,color:'var(--red)'},
  ];
  const sevColors = {critical:'var(--red)',high:'var(--amber)',medium:'var(--blue)',low:'var(--gray)'};
  return (
    <div style={{flex:1,overflowY:'auto',padding:16}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:16}}>
        <KPICard value="38" label="Total Rules" color="blue"/>
        <KPICard value="25" label="Manual" color="green"/>
        <KPICard value="13" label="AI-Generated" color="amber"/>
        <KPICard value="3" label="Pending Approval" color="red"/>
      </div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.08em',color:'var(--t2)',display:'flex',alignItems:'center',gap:8}}>
          <span style={{display:'inline-block',width:12,height:2,background:'var(--blue)'}}/>Safety Rule Management
        </div>
        <div style={{display:'flex',gap:6}}>
          <Btn variant="teal" onClick={()=>setShowModal(true)}>✦ AI Generate</Btn>
          <Btn variant="ghost">+ Manual Add</Btn>
        </div>
      </div>
      <div style={{display:'flex',gap:5,marginBottom:14,borderBottom:'1px solid var(--border)',paddingBottom:0}}>
        {tabs.map(t=>(
          <button key={t.key} onClick={()=>setTab(t.key)}
            style={{padding:'7px 14px',border:'none',background:'transparent',
              cursor:'pointer',fontSize:12,fontWeight:tab===t.key?700:400,
              color:tab===t.key?'var(--blue)':'var(--t2)',fontFamily:'inherit',
              borderBottom:`2px solid ${tab===t.key?'var(--blue)':'transparent'}`,
              transition:'all .15s'}}>
            {t.label} ({t.n})
          </button>
        ))}
      </div>
      <div>
        {(rules[tab]||[]).map((r,i)=>(
          <div key={r.id} style={{display:'flex',alignItems:'flex-start',gap:10,
            padding:'10px 14px',background:'#fff',border:'1px solid var(--border)',
            borderRadius:8,marginBottom:7}}>
            <div style={{width:28,height:28,borderRadius:6,flexShrink:0,
              background:`${sevColors[r.sev]}15`,border:`1px solid ${sevColors[r.sev]}30`,
              display:'flex',alignItems:'center',justifyContent:'center',
              color:sevColors[r.sev],fontSize:13}}>⚑</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:12,lineHeight:1.6,marginBottom:5}}>{r.text}</div>
              <div style={{display:'flex',gap:10,flexWrap:'wrap',fontSize:10,color:'var(--t3)'}}>
                <span style={{fontWeight:700,color:sevColors[r.sev],textTransform:'uppercase'}}>{r.sev}</span>
                <span>{r.id}</span>
                <span>{r.process}</span>
                <span style={{color:r.source==='AI-Generated'?'var(--blue)':'var(--t3)'}}>{r.source}</span>
              </div>
            </div>
            <div style={{display:'flex',gap:5,flexShrink:0,marginTop:2}}>
              {tab==='pending' && (
                <Btn variant="teal" size="sm" onClick={()=>{
                  setRules(prev=>({...prev,
                    pending:prev.pending.filter((_,j)=>j!==i),

                  toast('Rule approved!','✓');
                }}>Approve</Btn>
              )}
              <Btn variant="ghost" size="sm">Edit</Btn>
              <Btn variant="danger" size="sm" onClick={()=>{
                setRules(prev=>({...prev,[tab]:prev[tab].filter((_,j)=>j!==i)}));

            <span style={{fontSize:12}}>No rules in this category</span>

          <Btn variant="primary" onClick={()=>{toast('Rules published!','⬆');setShowModal(false);}}>Publish</Btn>

          <div style={{fontWeight:700,color:'var(--blue)',marginBottom:8}}>✦ AI Generated Output</div>
          <b style={{color:'var(--red)'}}>Unsafe Actions:</b><br/>
          • Operator must not enter press zone while machine cycle is active<br/>
          • Machine guard must be confirmed before approaching<br/><br/>
          <b style={{color:'var(--amber)'}}>Preventive Rules:</b><br/>
          • Dual-lock mechanism required at all press stations<br/>
          • Proximity sensor within 1.5m of press zone
        </div>
      </Modal>
    </div>
  );
}

                    <div style={{fontSize:11,fontWeight:700,color:barColors(vals[i])}}>{vals[i]}</div>

          </div>
        </Panel>
      </div>

// ─── ROOT APP ─────────────────────────────────────────────
function App(){
  const [page,setPage] = useState('dashboard');
  const [selectedCam,setSelectedCam] = useState(null);
  const [clock,setClock] = useState('');
  const {toasts,add:toast} = useToast();

  useEffect(()=>{
    const fmt = ()=>{
      const n = new Date();
      setClock(`${n.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})} — ${n.toLocaleTimeString('en-GB')}`);
    };
    fmt();
    const t = setInterval(fmt,1000);
    return ()=>clearInterval(t);
  },[]);

  const nav = key=>{
    if(key!=='dashboard'&&key!=='cameras') setSelectedCam(null);
    setPage(key);
  };

  const openCamera = cam=>{
    setSelectedCam(cam);
    setPage('detail');
  };

  const renderPage = ()=>{
    if(page==='detail'&&selectedCam)
      return <CameraDetail cam={selectedCam} onBack={()=>nav('dashboard')} toast={toast}/>;
    if(page==='sop') return <SOPManagement toast={toast}/>;
    if(page==='prompts') return <PromptLibrary toast={toast}/>;
    if(page==='alerts') return <AlertCenter toast={toast}/>;
    if(page==='rules') return <SafetyRules toast={toast}/>;
    if(page==='events') return <EventHistory toast={toast}/>;
    if(page==='analytics') return <Analytics/>;
    return <Dashboard onOpenCamera={openCamera}/>;
  };

  const activeNav = page==='detail'?'cameras':page;

  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden',background:'var(--bg)'}}>
      <Sidebar active={activeNav} onNav={nav} clock={clock}/>
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minWidth:0}}>
        <Topbar clock={clock}/>
        <div style={{flex:1,display:'flex',overflow:'hidden'}}>
          {renderPage()}
        </div>
      </div>
      <ToastContainer toasts={toasts}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
